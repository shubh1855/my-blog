    url: https://github.com/shubh1855/
    icon: ri:github-fill
    color: '#191717'
  linkedin:
    url: https://www.linkedin.com/in/shubhranil-paul
    icon: ri:linkedin-box-fill
    color: '#0A66C2'
  email:
    url: mailto:paulshubh2005@gmail.com
    icon: ri:mail-line
    color: '#55acd5'
  rss:
    url: /rss.xml
    icon: ri:rss-line
    color: '#ff6600'
    # -------------------------------------------------------------------------
    # More optional social platform examples below; uncomment and edit to enable:
    # -------------------------------------------------------------------------
    # twitter:
    #   url: https://x.com/your-handle
    #   icon: ri:twitter-fill
    #   color: '#4b9ae4'
    # bilibili:
    #   url: https://space.bilibili.com/your-id
    #   icon: ri:bilibili-fill
    #   color: '#da708a'
    # zhihu:
    #   url: https://www.zhihu.com/people/your-id
    #   icon: ri:zhihu-fill
    #   color: '#1e88e5'
    # music:
    #   url: https://music.163.com/#/user/home?id=your-id
    #   icon: ri:netease-cloud-music-line
    #   color: '#e60026'
    # =============================================================================
    # Friends Links
    # Friends page - shows the friend link list and how to apply
    # =============================================================================
    # intro: page intro text
    #   title: page title
    #   subtitle: page subtitle
    #   applyTitle: application section title
    #   applyDesc: application instructions
    #   exampleYaml: example application (YAML format)
    # data: friend link list
    #   - site: site name
    #   - url: site address
    #   - owner: site owner nickname
    #   - desc: site description
    #   - image: avatar image URL
    #   - color: (optional) card background colour, hex format
    # -----------------------------------------------------------------------------
friends:
