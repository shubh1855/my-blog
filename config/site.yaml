# =============================================================================
# Content Processing Options
# Content processing options - control post rendering and interaction
# =============================================================================
# Fields:
#   addBlankTarget: open external links in a new window
#   smoothScroll: enable smooth scroll animation
#   addHeadingLevel: add level anchors to headings automatically
#   enhanceCodeBlock: enhanced code block styling (line numbers, language label, etc.)
#   enableCodeCopy: show the code block copy button
#   enableCodeFullscreen: show the code block full-screen button
#   enableLinkEmbed: enable link card previews (parses OG info)
#   enableTweetEmbed: enable tweet embeds
#   enableOGPreview: enable Open Graph preview cards
#   previewCacheTime: preview info cache time (days)
#   lazyLoadEmbeds: lazy-load embedded content (better performance)
#   postCardImagePosition: post card cover position (alternating/left/right)
# -----------------------------------------------------------------------------
content:
  addBlankTarget: true # open external links in a new window
  smoothScroll: true # smooth scrolling
  addHeadingLevel: true # heading anchors
  enhanceCodeBlock: true # enhanced code blocks
  enableCodeCopy: true # code copy button
  enableCodeFullscreen: true # code full-screen button
  enableLinkEmbed: true # link card previews
  enableCodePenEmbed: true # CodePen embeds
  enableTweetEmbed: true # tweet embeds
  enableOGPreview: true # OG preview cards
  previewCacheTime: 30 # preview cache time (days)
  lazyLoadEmbeds: true # lazy-load embeds
  postCardImagePosition: alternating # home page cover position: alternating (default) alternates, left keeps covers on the left, right keeps them on the right
  # Shoka-compatible features (all on by default; set false to disable)
  enableShokaContainers: true # :::note blocks ;;;tab cards +++collapsible blocks
  enableShokaAttrs: true # [text]{.class} attribute syntax
  enableShokaEffects: true # ++underline++ ==highlight== ~subscript~ ^superscript^
  enableShokaSpoiler: true # !!hidden text!!
  enableShokaRuby: true # {text^ruby} ruby annotations
  enableShokaHexoTags: true # {% links %} {% media %} Hexo tags
  enableMath: true # $math$ KaTeX rendering
  enableCodeMeta: true # code block extras (title, mark, command)
  enableQuiz: true # interactive quiz questions
  enableEncryptedBlock: true # :::encrypted{password="..."} encrypted content blocks
# =============================================================================
# Navigation Routes
# Navigation menu - defines the top navigation bar items
# =============================================================================
# Fields:
#   name: menu item display name
#   path: link path (can be omitted when children exist; clicking expands the submenu)
#   icon: Iconify icon id, format "collection:icon-name"
#   children: (optional) submenu list, same structure as the parent
# -----------------------------------------------------------------------------
# Icon references:
#   - Font Awesome 6: https://icon-sets.iconify.design/fa6-solid/
#   - Remix Icon: https://icon-sets.iconify.design/ri/
# -----------------------------------------------------------------------------
navigation:
  - name: Home # display name (fallback text when nameKey is missing)
    nameKey: nav.home # i18n translation key
    path: / # link path
    icon: ri:home-heart-fill # icon
  # - name: Reading
  #   path: /reading
  - name: Weekly
    nameKey: nav.weekly
    path: /weekly
    icon: ri:newspaper-line
  - name: Writeups
    path: /categories/writeups
    icon: ri:shield-keyhole-fill
  - name: Posts # path can be omitted when there is a submenu
    nameKey: nav.posts
    icon: ri:quill-pen-ai-fill
    children:
      # submenu list
      - name: Categories
        nameKey: nav.categories
        path: /categories
        icon: ri:grid-fill
      - name: Tags
        nameKey: nav.tags
        path: /tags
        icon: fa6-solid:tags
      - name: Archives
        nameKey: nav.archives
        path: /archives
        icon: ri:archive-2-fill
  - name: Friends
    nameKey: nav.friends
    path: /friends
    icon: ri:links-line
  - name: About
    nameKey: nav.about
    path: /about
    icon: fa6-regular:circle-user
  - name: Playlist
    nameKey: nav.music
    path: /music
    icon: ri:music-2-fill
    # =============================================================================
    # Comment System
    # =============================================================================
    # provider: comment system provider ('remark42' | 'giscus' | 'waline' | 'twikoo' | 'none')
    #           set to 'none' or leave unset to disable comments
    # Provider settings:
    # -----------------------------------------------------------------------------
    #   remark42: self-hosted lightweight comment system (https://remark42.com/docs/getting-started/installation/)
    #     host: https://comment.example.com/ # Remark42 server address
    #     siteId: your-site-id # site ID
    #   giscus: comment system based on GitHub Discussions (https://giscus.app)
    #     repo: GitHub repository (owner/repo format)
    #     repoId: repository ID (from giscus.app)
    #     category: Discussion category name
    #     categoryId: category ID (from giscus.app)
    #     mapping: mapping mode ('pathname' | 'url' | 'title' | 'og:title' ...)
    #     reactionsEnabled: enable reactions (default: '1') # only '0' | '1'
    #     emitMetadata: emit metadata (default: '0') # only '0' | '1'
    #     inputPosition: input box position ('top' | 'bottom', default: 'top')
    #     lang: language (default: the page locale)
    #     host: custom giscus host (optional) 'https://giscus.app' | '...'
    #     theme: theme (optional) 'light' | 'dark' | '...'
    #     loading: loading mode (optional) 'lazy' | 'eager';
    #   waline: simple, secure comment system (https://waline.js.org)
    #     serverURL: Waline server address (required)
    #     lang: language (default: the page locale)
    #     dark: dark mode support (default: 'html.dark')
    #           - string: CSS selector; dark mode is on when it matches
    #           - true: follow the device
    #           - false: disable dark mode
    #     meta: commenter info fields (default: ['nick', 'mail', 'link'])
    #     requiredMeta: required fields (default: [])
    #     login: login mode ('enable' | 'disable' | 'force', default: 'enable')
    #     wordLimit: comment length limit
    #           - single number: maximum length
    #           - array [min, max]: minimum and maximum length
    #           - 0: no limit (default: 0)
    #     pageSize: comments per page (default: 10)
    #     imageUploader: image uploads (default: false)
    #     highlighter: code highlighting (default: true)
    #     texRenderer: LaTeX rendering (default: false)
    #     search: search (default: false)
    #     reaction: post reactions
    #           - false: disabled (default)
    #           - true: default reactions
    #           - array: custom reaction icon URLs
    #     emoji: emoji packs
    #           - false: disable emoji
    #           - true: default emoji packs
    #           - array: custom emoji pack list (default: ['//unpkg.com/@waline/emojis@1.2.0/weibo'])
    #     commentSorting: comment order ('latest' | 'oldest' | 'hottest', default: 'latest')
    #     noCopyright: hide footer copyright (default: false)
    #     comment: comment count stats (default: true)
    #     pageview: page view stats (default: true)
    #     recaptchaV3Key: reCAPTCHA v3 Key (optional)
    #     turnstileKey: Cloudflare Turnstile Key (optional)
    #     locale: custom UI strings (optional)
    # twikoo:
    # envId: # Twikoo environment ID (Tencent Cloud) or Vercel environment URL (required)
    # region: # environment region, default ap-shanghai
    # path: # custom JS path used to tell posts apart; set this if your post path is not location.pathname
    # lang: # language (default: the page locale)
comment:
  provider: none # 'remark42' | 'giscus' | 'waline' | 'twikoo' | 'none'
  # remark42:
  #   host: https://comment.example.com/
  #   siteId: your-site-id
  # giscus:
  #   repo: username/repo              # GitHub repository (owner/repo format)
  #   repoId: R_kgDOxxxxxx             # repository ID (from giscus.app)
  #   category: Announcements          # Discussion category name
  #   categoryId: DIC_kwDOxxxxxx       # category ID (from giscus.app)
  #   mapping: pathname                # mapping mode
  #   reactionsEnabled: '1'            # enable reactions ('0' | '1')
  #   emitMetadata: '0'                # emit metadata ('0' | '1')
  #   inputPosition: top               # input box position ('top' | 'bottom')
  #   lang: en                         # language

  # waline:
  #   serverURL: https://your-waline.vercel.app  # Waline server address (required)
  #   lang: en                         # language (default: the page locale)
  #   dark: html.dark                  # dark mode (default: 'html.dark')
  #                                    # options: true (follow device) | false (disable) | CSS selector string
  #   meta:                            # commenter info fields (default: ['nick', 'mail', 'link'])
  #     - nick
  #     - mail
  #     - link
  #   requiredMeta:                    # required fields (default: [])
  #     - nick
  #   login: enable                    # login mode ('enable' | 'disable' | 'force', default: 'enable')
  #   wordLimit: 0                     # comment length limit (0 = no limit, default: 0)
  #                                    # options: single number | [min, max] array
  #   pageSize: 10                     # comments per page (default: 10)
  #   imageUploader: false             # image uploads (default: false)
  #   highlighter: true                # code highlighting (default: true)
  #   texRenderer: false               # LaTeX rendering (default: false)
  #   search: false                    # search (default: false)
  #   reaction: false                  # post reactions (default: false)
  #                                    # options: true | false | string array (custom reaction icons)
  #   emoji: true                      # emoji packs (default: ['//unpkg.com/@waline/emojis@1.2.0/weibo'])
  #                                    # options: true | false | string/object array
  #                                    # preset pack: '//unpkg.com/@waline/emojis@1.2.0/weibo'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/alus'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/bilibili'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/qq'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/tieba'
  #                                    #           '//unpkg.com/@waline/emojis@1.2.0/tw-emoji'
  #   commentSorting: latest           # comment order ('latest' | 'oldest' | 'hottest', default: 'latest')
  #   noCopyright: false               # hide footer copyright (default: false)
  #   comment: true                    # comment count stats (default: true)
  #   pageview: true                   # page view stats (default: true)
  #   # recaptchaV3Key: ''             # reCAPTCHA v3 Key (optional)
  #   # turnstileKey: ''               # Cloudflare Turnstile Key (optional)
  #   # locale:                        # custom UI strings (optional)
  #   #   placeholder: 'Leave a comment...' # custom input placeholder
  twikoo:
    envId: https://your-twikoo.vercel.app # Twikoo environment ID (Tencent Cloud) or Vercel environment URL (required)
    # region: ap-shanghai              # environment region, default ap-shanghai
    # path: location.pathname          # custom JS path used to tell posts apart
    # lang: en                        # language (default: the page locale)
    # =============================================================================
    # Analytics (Umami)
    # =============================================================================
    # id: Umami website ID
    # endpoint: Umami server address
    # enabled: enable analytics
    # statistics_display: stats display settings
    #   token: Umami share-link token (read-only, safe to expose to the client)
    #   article_page_views: show view counts on post pages
    #   footer_site_stats: show site-wide views in the footer Site Stats
    # -----------------------------------------------------------------------------
analytics:
  umami:
    enabled: false
    # statistics_display:
    #   token: your-umami-share-token
    #   article_page_views: true
    #   footer_site_stats: true
    # =============================================================================
    # SEO Configuration
    # =============================================================================
    # https://github.com/alextim/astro-lib/tree/main/packages/astro-robots-txt#readme
    # robots: robots.txt settings (generated by astro-robots-txt)
    #   policy: crawler policy list (optional, allows all by default)
    #     - userAgent: crawler name, '*' means all
    #       allow: allowed paths (string or array)
    #       disallow: disallowed paths (string or array)
    #   host: add a Host directive (optional, for Yandex)
    # -----------------------------------------------------------------------------
seo:
  robots:
  # policy:                          # crawler policy (optional; uncomment and configure)
  #   - userAgent: '*'
  #     allow: '/'
  #     disallow:
  #       - '/api/'
  # host: true                       # optional: add Host directive (Yandex)
bgm:
  enabled: true
  audio:
    - title: "Heavy Metal Mix"
      list:
        - name: "For Whom The Bell Tolls"
          artist: "Metallica"
          youtubeId: "B_HSa1dEL9s"
        - name: "Dance of Death"
          artist: "Iron Maiden"
          youtubeId: "3659fTXvFts"
        - name: "Fade to Black"
          artist: "Metallica"
          youtubeId: "9HZ_tx8aWuA"

  # =============================================================================
  # Bangumi (Media Tracking)
  # Bangumi page - comment out the whole bangumi section to turn it off (page + nav hide automatically)
  # =============================================================================
  # Fields:
  #   userId: Bangumi username or numeric ID (required)
  #   label: navigation name (optional, default: Anime)
  #   icon: navigation icon, Iconify format (optional, default: ri:bilibili-fill)
  # -----------------------------------------------------------------------------
  # bangumi:
  #   userId: cosine
  #   # label: Anime
  #   # icon: ri:bilibili-fill
  # =============================================================================
  # Development Tools (Dev Only)
  # Dev tools - only active in development (pnpm dev)
  # =============================================================================
  # When set, post pages in development show an edit button that opens your local editor
  # Fields:
  #   localProjectPath: absolute path of the local project (used to build full file paths)
  #   contentRelativePath: blog content path relative to the project root (default: 'src/content/blog')
  #   editors: editor list
  #     - id: unique editor id
  #     - name: editor display name
  #     - icon: Iconify icon id (search at https://icon-sets.iconify.design/)
  #     - urlTemplate: URL template, supports the {path} placeholder (absolute file path)
  # -----------------------------------------------------------------------------
dev:
  localProjectPath: '/home/shubh/Project/astro-koharu'
  contentRelativePath: 'src/content/blog'
  editors:
    - id: vscode
      name: VS Code
      icon: devicon-plain:vscode
