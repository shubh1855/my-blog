# =============================================================================
# Announcements
# Announcements - shows important notices at the top of the page
# =============================================================================
# Fields:
#   id: unique identifier, used to remember read state (localStorage)
#   title: announcement title
#   content: announcement text
#   type: type, sets the colour style (info/success/warning/error)
#   priority: priority number; higher sorts first
#   color: (optional) custom colour, overrides the type default
#   publishDate: publish date, format 'YYYY-MM-DD'
#   startDate: (optional) start showing at, ISO 8601 format
#   endDate: (optional) stop showing at; hidden automatically after expiry
#   link: (optional) related link
#     url: link address
#     text: link text
#     external: open in a new window (true/false)
# -----------------------------------------------------------------------------
# Uncomment below to enable the example announcements:
# -----------------------------------------------------------------------------
announcements:
# - id: welcome-2026 # unique identifier
#   title: Happy New Year 2026! # announcement title

#   content: Happy New Year! Thanks for all your support~ # announcement text
#   type: success # type: info/success/warning/error
#   priority: 10 # priority; higher sorts first
