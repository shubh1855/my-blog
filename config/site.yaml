#   icon: Iconify icon id, in the form "collection:icon-name"
#         Icon search: https://icon-sets.iconify.design/ri/
#   color: (optional) icon colour, hex format e.g. '#191717'
# -----------------------------------------------------------------------------
# Add a platform: copy an existing block and change the key name and field values
# -----------------------------------------------------------------------------
social:
