#   startDate: '2025-12-31T00:00:00+08:00' # (optional) start showing at
#   endDate: '2026-01-15T23:59:59+08:00' # (optional) stop showing at
#   link: # (optional) related link
#     url: https://example.com
#     text: Learn more
#     external: true # open in a new window
