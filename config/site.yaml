# yaml-language-server: $schema=https://json-schema.org/draft-07/schema
# =============================================================================
# Site Configuration
# =============================================================================
# This file contains all site-specific configurations.
# Modify this file to customize your blog.
# After changes, rebuild the site: docker compose up -d --build
# =============================================================================
# =============================================================================
# Site Basic Information
# =============================================================================
site:
  title: "Shubh's Corner"
  alternate: shubh
  subtitle: "Code, Create, Repeat"
  name: Shubh
  description: "I write about development, tech, security, and little trinkets of what I enjoy"
  avatar: /img/avatar.webp
  showLogo: true
  author: Shubh
  url: https://shubhsec.dev
  defaultOgImage: /img/avatar.webp
  startYear: 2025
  timezone: Asia/Kolkata
  keywords:
    - blog
    - tech
    - development
    - engineering
    - frontend
    # breadcrumbHome: Home
    # Enable slug transliteration (converts CJK characters to pinyin/romaji)
    # enableSlugTransliteration: true
    # =============================================================================
    # Internationalization (i18n)
    # Internationalization - controls multi-language support
    # =============================================================================
    # defaultLocale: default locale code (no URL prefix)
    # locales: list of supported locales
    #   - code: locale code (BCP 47 short form, e.g. 'en', 'ja')
    #   - label: locale display name (e.g. 'English', '日本語')
    # -----------------------------------------------------------------------------
i18n:
  defaultLocale: en
  locales:
    - code: en
      label: English
# =============================================================================
# Category Map
# Maps category names to URL-friendly slugs
# Example: 'Life' category URL becomes /categories/life
# =============================================================================
categoryMap:
  # Primary categories
  Notes: note
  Tools: tools
  Linux: linux
  Weekly: weekly
  # Secondary categories (for nested paths)
  Frontend: front-end
  Writeups: writeups
  # CTF groups
  RAIT-CTF 2026 Finals: rait-ctf-2026-finals
  Technovate CTF: technovate-ctf
  "HTB Cyber Apocalypse CTF 2026: The Salt Crown": htb-cyber-apocalypse-2026
  Xploitathon CTF: xploitathon-ctf
  KPMG CTF 2026: kpmg-ctf-2026
  BSides Mumbai CTF: bsides-mumbai-2026
  # Add more as needed:
  # Reading: reading
  # Backend: back-end
  # Algorithms: algorithm
  # Projects: project
  # =============================================================================
  # Featured Categories (Homepage)
  # Featured categories - category entries shown as cards on the home page
  # =============================================================================
  # Fields:
  #   link: category link path, matching an English slug in categoryMap
  #   label: category name shown on the card
  #   image: cover image path (relative to public/)
  #   description: category description shown on the card
  # -----------------------------------------------------------------------------
featuredCategories:
  - link: note
    label: Notes
    image: /img/cover/notes.webp
    description: Technical notes and learnings
  - link: writeups
    label: Writeups
    image: /img/cover/writeups.webp
    description: Cybersecurity CTF and challenge writeups
  - link: tools
    label: Tools
    image: /img/cover/tools.webp
    description: Tools and productivity tips
    # Show a placeholder until the first Tools post is published; real category content then takes priority.
    comingSoon: true
  - link: linux
    label: Linux
    image: /img/cover/lelouch-inside-mech.webp
    description: Linux internals and administration
# =============================================================================
# Featured Series
# Featured series - showcases regularly updated series content (multiple series supported)
# =============================================================================
# Fields:
#   slug: URL path (required), e.g. 'weekly' maps to /weekly
#         Note: must not conflict with reserved routes, including: about, categories, tags, friends, posts, archives, api, _astro, rss.xml, sitemap.xml, robots.txt, favicon.ico, etc.
#   categoryName: matching category name (required, must exist in categoryMap)
#   label: short name shown in the sidebar/navigation (optional)
#   fullName: full name shown as the series page title (optional)
#   description: series introduction, supports multi-line Markdown (optional)
#   cover: series page header image, relative to public/ (optional)
#   enabled: whether the series is enabled; set false to turn it off (optional, default true)
#   icon: navigation icon in Iconify format, e.g. 'ri:newspaper-line' (optional)
#   highlightOnHome: highlight the latest post on the home page (optional, default true; set false to disable)
#   links: related links (optional)
# -----------------------------------------------------------------------------
featuredSeries:
  - slug: weekly
    categoryName: Weekly
    label: Weekly
    fullName: Tech Weekly
    description: |
      A weekly roundup of interesting tech finds,
      learnings, and development insights.
    cover: /img/site_header_1920.webp
    enabled: true
    icon: ri:newspaper-line
    links:
      github: https://github.com/shubh1855/
      rss: /rss.xml
# =============================================================================
